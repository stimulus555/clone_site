<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admissions Layout Wireframe</title>
    <link rel="stylesheet" href="admissions.css" />
  </head>
  <body>
    <nav class="page-navigation" aria-label="Page navigation">
      <a href="index.html">First Page</a>
      <a class="current-page" href="admissions.html">Second Page</a>
    </nav>
    <main>
      <section class="admission-hero">
        <div class="admission-heading layout-box" data-box="1">1</div>
        <div class="admission-subheading layout-box" data-box="2">2</div>
        <div class="admission-cards">
          <article class="layout-box admission-card" data-box="3"><div class="image-slot">4</div><div class="card-content">5<div class="button-slot">6</div></div></article>
          <article class="layout-box admission-card" data-box="7"><div class="image-slot">8</div><div class="card-content">9<div class="button-slot">10</div></div></article>
          <article class="layout-box tour-card" data-box="11">11</article>
        </div>
      </section>
    </main>
    <footer class="site-footer">
      <section class="footer-brand layout-box" data-box="12"><div class="logo-slot">13</div><div class="social-slot">14</div><div class="tour-slot">15</div></section>
      <section class="footer-links"><div class="layout-box footer-column" data-box="16">16</div><div class="layout-box footer-column" data-box="17">17</div><div class="layout-box footer-column" data-box="18">18</div><div class="layout-box footer-column" data-box="19">19</div></section>
      <div class="layout-box copyright-slot" data-box="20">20</div>
    </footer>
    <div class="float-buttons"><button class="layout-box round-button" data-box="21" type="button">21</button><button class="layout-box round-button" data-box="22" type="button">22</button></div>
    <button class="layout-box help-button" data-box="23" type="button">23</button>
    <script src="admissions.js"></script>
  </body>
</html>
